<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGNI AI — Login</title>
  <link rel="stylesheet" href="style.css?v=11" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-2QPhm+X8rl5y2QLM/OS+3kSvI7P014/UKZdI9Yn2tYj1c3B7OZs2Gfok/0KGMqZ2" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body class="login-page">
  <main class="login-shell">
    <div class="login-card">
      <img src="Sitelogo.svg" alt="AGNI AI" class="login-logo" />
      <h1>Welcome to AGNI AI</h1>
      <p>Sign in with Google to access your private workspace and conversation history.</p>
      <div id="google-signin-button" class="google-signin-button"></div>
      <p class="login-note">Your workspace is private and stored securely.</p>
    </div>
  </main>
  <script>
    const loginOrigin = window.location.origin;

    function setLoginNote(message, isError = false) {
      const note = document.querySelector('.login-note');
      if (!note) return;
      note.textContent = message;
      note.classList.toggle('error', isError);
    }

    // This callback fires after the user picks their Google account.
    // We POST the credential token to our backend to verify and create a session.
    async function handleCredentialResponse(response) {
      if (!response || !response.credential) return;

      try {
        setLoginNote('Signing you in…');

        const result = await fetch('/auth/google/callback', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id_token: response.credential })
        });

        if (!result.ok) {
          const error = await result.json().catch(() => ({}));
          throw new Error(error.error || 'Login failed');
        }

        const data = await result.json().catch(() => ({}));
        window.location.href = data.redirect || '/';
      } catch (error) {
        setLoginNote(error.message || 'Login failed. Please try again.', true);
      }
    }

    async function initGoogleSignin() {
      let clientId = '';

      try {
        const response = await fetch('/api/google-client-id');
        if (!response.ok) throw new Error('Failed to fetch client ID');
        const data = await response.json();
        clientId = data.clientId || '';
      } catch (err) {
        setLoginNote('Failed to fetch Google client ID. Try refreshing the page.', true);
        return;
      }

      if (!clientId) {
        setLoginNote('Google login is not configured. Please set GOOGLE_CLIENT_ID in your environment.', true);
        return;
      }

      if (!window.google?.accounts?.id) {
        setLoginNote('Unable to initialize Google login. Please refresh the page.', true);
        return;
      }

      try {
        // KEY FIX: use ux_mode 'popup' so Google returns the credential to the
        // JS callback instead of doing a page redirect. This means no redirect_uri
        // is sent to Google at all, so redirect_uri_mismatch cannot occur.
        window.google.accounts.id.initialize({
          client_id: clientId,
          callback: handleCredentialResponse,
          ux_mode: 'popup',
          auto_select: false,
          cancel_on_tap_outside: true
        });

        window.google.accounts.id.renderButton(
          document.getElementById('google-signin-button'),
          { theme: 'outline', size: 'large', width: 320 }
        );
      } catch (error) {
        if (String(error).includes('origin')) {
          setLoginNote(
            `Add ${loginOrigin} to Authorized JavaScript Origins in Google Cloud Console.`,
            true
          );
          return;
        }
        setLoginNote('Google login failed to initialize. Check your OAuth client config.', true);
        console.error('Google init error:', error);
      }
    }

    function loadGoogleClient() {
      const script = document.createElement('script');
      script.src = 'https://accounts.google.com/gsi/client';
      script.async = true;
      script.defer = true;
      script.onload = initGoogleSignin;
      script.onerror = () => setLoginNote('Failed to load Google sign-in script. Check your network.', true);
      document.body.appendChild(script);
    }

    document.addEventListener('DOMContentLoaded', loadGoogleClient);
  </script>
</body>
</html>
