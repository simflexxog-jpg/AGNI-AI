<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGNI AI — Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; font-family: 'Geist', system-ui, -apple-system, sans-serif; background: #0a0a0f; color: #f8fafc; }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(circle at top left, rgba(99,102,241,0.18), transparent 30%), radial-gradient(circle at bottom right, rgba(168,85,247,0.10), transparent 28%); pointer-events: none; }
    .card { width: min(460px, 100%); padding: 40px 36px; background: rgba(8,13,29,0.96); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; box-shadow: 0 24px 80px rgba(0,0,0,0.42); }
    .card h1 { font-size: 1.8rem; margin-bottom: 10px; color: #fff; }
    .subtitle { color: rgba(255,255,255,0.68); margin-bottom: 28px; line-height: 1.6; }
    .form { display: grid; gap: 16px; }
    .field { display: grid; gap: 8px; }
    .field label { font-size: 0.85rem; color: rgba(255,255,255,0.84); }
    .input-wrap { display: flex; align-items: center; }
    .input-wrap input { width: 100%; border: 1px solid rgba(255,255,255,0.18); border-radius: 12px; background: rgba(255,255,255,0.05); color: #f8fafc; padding: 12px 14px; font: inherit; transition: border-color 0.18s ease, background 0.18s ease; }
    .input-wrap input:focus { outline: none; border-color: rgba(99,102,241,0.8); background: rgba(255,255,255,0.08); }
    .input-wrap input::placeholder { color: rgba(255,255,255,0.42); }
    .btn-primary { display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 12px 16px; border-radius: 12px; border: none; background: linear-gradient(135deg, #8b5cf6, #6366f1); color: #fff; font: inherit; font-weight: 700; cursor: pointer; transition: transform 0.18s ease, box-shadow 0.18s ease; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 30px rgba(99,102,241,0.2); }
    .btn-secondary { display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.92); text-decoration: none; font: inherit; cursor: pointer; }
    .field-error { color: #fb7185; font-size: 0.84rem; min-height: 1.1em; }
    #status { min-height: 1.2em; color: rgba(255,255,255,0.9); font-size: 0.92rem; }
    .footer { margin-top: 24px; font-size: 0.82rem; color: rgba(255,255,255,0.55); text-align: center; }
    .footer a { color: rgba(255,255,255,0.85); text-decoration: none; }
    .footer a:hover { color: #fff; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Reset your password</h1>
    <p class="subtitle">Enter your email and we’ll send a one-time code for password reset..</p>
    <form id="reset-form" class="form" novalidate>
      <div class="field">
        <label for="reset-email">Email address</label>
        <div class="input-wrap">
          <input id="reset-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required aria-describedby="reset-email-error" />
        </div>
        <div class="field-error" id="reset-email-error" role="alert" aria-live="polite"></div>
      </div>

      <div id="otp-section" hidden>
        <div class="field">
          <label for="reset-otp">OTP code</label>
          <div class="input-wrap">
            <input id="reset-otp" name="otp" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Enter 6-digit code" aria-describedby="reset-otp-error" />
          </div>
          <div class="field-error" id="reset-otp-error" role="alert" aria-live="polite"></div>
        </div>

        <div class="field">
          <label for="reset-password">New password</label>
          <div class="input-wrap">
            <input id="reset-password" name="password" type="password" autocomplete="new-password" placeholder="New password" aria-describedby="reset-password-error" />
          </div>
          <div class="field-error" id="reset-password-error" role="alert" aria-live="polite"></div>
        </div>

        <div class="field">
          <label for="reset-confirm-password">Confirm password</label>
          <div class="input-wrap">
            <input id="reset-confirm-password" name="confirm_password" type="password" autocomplete="new-password" placeholder="Confirm new password" aria-describedby="reset-confirm-password-error" />
          </div>
          <div class="field-error" id="reset-confirm-password-error" role="alert" aria-live="polite"></div>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="reset-submit">Send OTP</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
    <a href="/login" class="btn-secondary">Back to sign in</a>
    <div class="footer">Built by <a href="https://agnib-portfolio.onrender.com/" target="_blank" rel="noopener noreferrer">Agni</a></div>
  </main>
  <script>
    const form = document.getElementById('reset-form');
    const emailEl = document.getElementById('reset-email');
    const otpSection = document.getElementById('otp-section');
    const otpEl = document.getElementById('reset-otp');
    const passwordEl = document.getElementById('reset-password');
    const confirmEl = document.getElementById('reset-confirm-password');
    const statusEl = document.getElementById('status');
    const emailErrorEl = document.getElementById('reset-email-error');
    const otpErrorEl = document.getElementById('reset-otp-error');
    const passwordErrorEl = document.getElementById('reset-password-error');
    const confirmErrorEl = document.getElementById('reset-confirm-password-error');
    const submitBtn = document.getElementById('reset-submit');

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value.trim());
    }

    function setStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.style.color = type === 'error' ? '#fb7185' : '#bfdbfe';
    }

    function clearErrors() {
      emailErrorEl.textContent = '';
      otpErrorEl.textContent = '';
      passwordErrorEl.textContent = '';
      confirmErrorEl.textContent = '';
    }

    function showOtpSection() {
      otpSection.hidden = false;
      submitBtn.textContent = 'Reset password';
      submitBtn.focus();
    }

    function resetSubmitText() {
      submitBtn.textContent = otpSection.hidden ? 'Send OTP' : 'Reset password';
    }

    function validateOtpPhase() {
      let valid = true;
      if (!otpEl.value.trim()) {
        otpErrorEl.textContent = 'Enter the OTP code.';
        valid = false;
      }
      if (!passwordEl.value) {
        passwordErrorEl.textContent = 'Enter your new password.';
        valid = false;
      } else if (passwordEl.value.length < 8) {
        passwordErrorEl.textContent = 'Password must be at least 8 characters.';
        valid = false;
      }
      if (confirmEl.value !== passwordEl.value) {
        confirmErrorEl.textContent = 'Passwords must match.';
        valid = false;
      }
      return valid;
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      clearErrors();
      setStatus('');

      const email = emailEl.value.trim();
      if (!email || !isValidEmail(email)) {
        emailErrorEl.textContent = 'Enter a valid email address.';
        emailEl.focus();
        return;
      }

      if (otpSection.hidden) {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending OTP…';

        try {
          const response = await fetch('/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            setStatus(data.error || 'Unable to send OTP.', 'error');
          } else {
            if (data.canReset) {
              showOtpSection();
            }
            const messageText = data.message || 'OTP sent. Check your email.';
            setStatus(data.debugOtp ? `${messageText} Code: ${data.debugOtp}` : messageText, '');
          }
        } catch (error) {
          setStatus('Network error. Please try again.', 'error');
        } finally {
          submitBtn.disabled = false;
          resetSubmitText();
        }
        return;
      }

      if (!validateOtpPhase()) {
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting…';

      try {
        const response = await fetch('/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email,
            otp: otpEl.value.trim(),
            password: passwordEl.value
          })
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          setStatus(data.error || 'Unable to reset password.', 'error');
        } else {
          setStatus(data.message || 'Password reset successful. Redirecting…');
          window.location.assign(data.redirect || '/');
        }
      } catch (error) {
        setStatus('Network error. Please try again.', 'error');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
