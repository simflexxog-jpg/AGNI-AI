<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGNI AI — Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Geist', system-ui, -apple-system, sans-serif;
      background: #0a0a0f;
      color: #f8fafc;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at top left, rgba(99,102,241,0.18), transparent 30%),
        radial-gradient(circle at bottom right, rgba(168,85,247,0.10), transparent 28%);
      pointer-events: none;
    }

    .card {
      width: min(460px, 100%);
      padding: 40px 36px;
      background: rgba(8,13,29,0.96);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.42);
    }

    /* Steps */
    .steps {
      display: flex;
      align-items: center;
      margin-bottom: 28px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .step-connector {
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
      margin: 0 8px;
      transition: background 0.4s;
    }

    .step-connector.lit { background: rgba(99,102,241,0.5); }

    .step-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: rgba(255,255,255,0.38);
      flex-shrink: 0;
      transition: all 0.3s;
    }

    .step.active .step-dot {
      border-color: #6366f1;
      background: rgba(99,102,241,0.14);
      color: #a5b4fc;
    }

    .step.done .step-dot {
      border-color: #6366f1;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: #fff;
    }

    .step-label {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.3);
      font-weight: 500;
      white-space: nowrap;
      transition: color 0.3s;
    }

    .step.active .step-label { color: rgba(255,255,255,0.75); }
    .step.done .step-label   { color: rgba(99,102,241,0.75); }

    /* Headings */
    .card h1 { font-size: 1.8rem; margin-bottom: 8px; color: #fff; }

    .subtitle {
      color: rgba(255,255,255,0.58);
      margin-bottom: 26px;
      line-height: 1.6;
      font-size: 0.91rem;
    }

    /* Form */
    .form { display: grid; gap: 16px; }

    .field { display: grid; gap: 7px; }

    .field label {
      font-size: 0.83rem;
      color: rgba(255,255,255,0.82);
      font-weight: 500;
    }

    .input-wrap input {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      color: #f8fafc;
      padding: 12px 14px;
      font: inherit;
      font-size: 0.94rem;
      transition: border-color 0.18s, background 0.18s, box-shadow 0.18s;
    }

    .input-wrap input:focus {
      outline: none;
      border-color: rgba(99,102,241,0.7);
      background: rgba(255,255,255,0.07);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.11);
    }

    .input-wrap input::placeholder { color: rgba(255,255,255,0.3); }
    .input-wrap input:disabled { opacity: 0.45; cursor: not-allowed; }

    #reset-otp {
      letter-spacing: 0.28em;
      font-size: 1.15rem;
      font-weight: 700;
      text-align: center;
    }

    .field-error {
      color: #fb7185;
      font-size: 0.81rem;
      min-height: 1.1em;
    }

    /* Resend row */
    .resend-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.4);
      margin-top: 1px;
    }

    #resend-btn {
      background: none;
      border: none;
      color: #a5b4fc;
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: color 0.15s;
    }

    #resend-btn:hover:not(:disabled) { color: #818cf8; }
    #resend-btn:disabled { color: rgba(255,255,255,0.25); cursor: default; text-decoration: none; }

    /* Buttons */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: #fff;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s, opacity 0.18s;
      margin-top: 4px;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 12px 30px rgba(99,102,241,0.22);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255,255,255,0.28);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      display: none;
    }

    .loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.11);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s;
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.2);
    }

    /* Status */
    #status {
      font-size: 0.87rem;
      border-radius: 10px;
      line-height: 1.5;
      min-height: 0;
      transition: all 0.2s;
    }

    #status.visible {
      padding: 10px 13px;
      background: rgba(99,102,241,0.09);
      border: 1px solid rgba(99,102,241,0.22);
      color: #bfdbfe;
    }

    #status.error.visible {
      background: rgba(251,113,133,0.07);
      border-color: rgba(251,113,133,0.22);
      color: #fda4af;
    }

    #status.success.visible {
      background: rgba(52,211,153,0.07);
      border-color: rgba(52,211,153,0.2);
      color: #6ee7b7;
    }

    /* OTP section slide-in */
    #otp-section {
      display: grid;
      gap: 16px;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.45s cubic-bezier(0.4,0,0.2,1), opacity 0.35s ease;
    }

    #otp-section.visible {
      max-height: 520px;
      opacity: 1;
    }

    /* Debug badge */
    #debug-badge {
      display: none;
      padding: 8px 12px;
      background: rgba(251,191,36,0.09);
      border: 1px solid rgba(251,191,36,0.28);
      border-radius: 8px;
      font-size: 0.79rem;
      color: #fbbf24;
      margin-top: 2px;
    }

    #debug-badge strong { letter-spacing: 0.15em; }

    /* Success screen */
    #success-screen { display: none; text-align: center; }

    .success-icon {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(52,211,153,0.18), rgba(99,102,241,0.12));
      border: 1.5px solid rgba(52,211,153,0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin: 0 auto 20px;
      animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }

    @keyframes pop {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    /* Footer */
    .footer {
      margin-top: 24px;
      font-size: 0.79rem;
      color: rgba(255,255,255,0.35);
      text-align: center;
    }

    .footer a { color: rgba(255,255,255,0.6); text-decoration: none; }
    .footer a:hover { color: #fff; }
  </style>
</head>
<body>
  <main class="card" role="main">

    <!-- Step indicator -->
    <div class="steps" id="step-indicator" aria-hidden="true">
      <div class="step active" id="s1">
        <div class="step-dot">1</div>
        <span class="step-label">Email</span>
      </div>
      <div class="step-connector" id="conn-1"></div>
      <div class="step" id="s2">
        <div class="step-dot">2</div>
        <span class="step-label">Verify</span>
      </div>
      <div class="step-connector" id="conn-2"></div>
      <div class="step" id="s3">
        <div class="step-dot">✓</div>
        <span class="step-label">Done</span>
      </div>
    </div>

    <!-- Main form screen -->
    <div id="form-screen">
      <h1 id="card-title">Reset password</h1>
      <p class="subtitle" id="card-subtitle">Enter your email and we'll send a 6-digit code.</p>

      <form id="reset-form" class="form" novalidate>

        <!-- Email -->
        <div class="field">
          <label for="reset-email">Email address</label>
          <div class="input-wrap">
            <input
              id="reset-email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
              aria-describedby="reset-email-error"
            />
          </div>
          <div class="field-error" id="reset-email-error" role="alert" aria-live="polite"></div>
        </div>

        <!-- OTP + password fields (revealed after email step) -->
        <div id="otp-section">

          <div class="field">
            <label for="reset-otp">6-digit code</label>
            <div class="input-wrap">
              <input
                id="reset-otp"
                name="otp"
                type="text"
                inputmode="numeric"
                pattern="[0-9]{6}"
                maxlength="6"
                placeholder="000000"
                autocomplete="one-time-code"
                aria-describedby="reset-otp-error"
              />
            </div>
            <div class="field-error" id="reset-otp-error" role="alert" aria-live="polite"></div>
            <div class="resend-row">
              <span id="resend-countdown"></span>
              <button type="button" id="resend-btn" disabled>Resend code</button>
            </div>
            <div id="debug-badge">Dev — OTP: <strong id="debug-otp-value"></strong></div>
          </div>

          <div class="field">
            <label for="reset-password">New password</label>
            <div class="input-wrap">
              <input
                id="reset-password"
                name="password"
                type="password"
                autocomplete="new-password"
                placeholder="At least 8 characters"
                aria-describedby="reset-password-error"
              />
            </div>
            <div class="field-error" id="reset-password-error" role="alert" aria-live="polite"></div>
          </div>

          <div class="field">
            <label for="reset-confirm">Confirm password</label>
            <div class="input-wrap">
              <input
                id="reset-confirm"
                name="confirm_password"
                type="password"
                autocomplete="new-password"
                placeholder="Repeat your new password"
                aria-describedby="reset-confirm-error"
              />
            </div>
            <div class="field-error" id="reset-confirm-error" role="alert" aria-live="polite"></div>
          </div>

        </div>

        <button type="submit" class="btn-primary" id="reset-submit">
          <div class="spinner"></div>
          <span id="submit-label">Send code</span>
        </button>

        <div id="status" role="status" aria-live="polite"></div>

      </form>

      <a href="/login" class="btn-secondary">← Back to sign in</a>
    </div>

    <!-- Success screen -->
    <div id="success-screen" role="status" aria-live="polite">
      <div class="success-icon">✓</div>
      <h1>Password updated</h1>
      <p class="subtitle" style="margin-top:8px;">
        Your password has been reset. Redirecting you to sign in…
      </p>
      <a href="/login" class="btn-secondary" style="margin-top:0;">Go to sign in</a>
    </div>

    <div class="footer">Built by <a href="https://agnib-portfolio.onrender.com/" target="_blank" rel="noopener noreferrer">Agni</a></div>
  </main>

  <script>
    const form          = document.getElementById('reset-form');
    const emailEl       = document.getElementById('reset-email');
    const otpSection    = document.getElementById('otp-section');
    const otpEl         = document.getElementById('reset-otp');
    const passwordEl    = document.getElementById('reset-password');
    const confirmEl     = document.getElementById('reset-confirm');
    const statusEl      = document.getElementById('status');
    const submitBtn     = document.getElementById('reset-submit');
    const submitLabel   = document.getElementById('submit-label');
    const emailError    = document.getElementById('reset-email-error');
    const otpError      = document.getElementById('reset-otp-error');
    const passwordError = document.getElementById('reset-password-error');
    const confirmError  = document.getElementById('reset-confirm-error');
    const resendBtn     = document.getElementById('resend-btn');
    const resendCountdown = document.getElementById('resend-countdown');
    const debugBadge    = document.getElementById('debug-badge');
    const debugOtpValue = document.getElementById('debug-otp-value');
    const cardTitle     = document.getElementById('card-title');
    const cardSubtitle  = document.getElementById('card-subtitle');
    const formScreen    = document.getElementById('form-screen');
    const successScreen = document.getElementById('success-screen');

    let phase = 'email'; // 'email' | 'otp' | 'done'
    let resendTimer = null;
    let resendSeconds = 0;
    const RESEND_WAIT = 60;

    // ── Utilities ─────────────────────────────────────────────────────────────
    function isValidEmail(v) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test((v || '').trim());
    }

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = msg ? ('visible ' + (type || '')) : '';
    }

    function clearErrors() {
      [emailError, otpError, passwordError, confirmError]
        .forEach(el => { el.textContent = ''; });
    }

    function setLoading(on) {
      submitBtn.disabled = on;
      submitBtn.classList.toggle('loading', on);
    }

    // ── Step indicator ────────────────────────────────────────────────────────
    function setStep(n) {
      ['s1','s2','s3'].forEach((id, i) => {
        const el = document.getElementById(id);
        el.className = 'step';
        if (i + 1 < n)  el.classList.add('done');
        if (i + 1 === n) el.classList.add('active');
      });
      ['conn-1','conn-2'].forEach((id, i) => {
        const el = document.getElementById(id);
        el.className = 'step-connector' + (n > i + 1 ? ' lit' : '');
      });
    }

    // ── Resend countdown ──────────────────────────────────────────────────────
    function startResendCountdown() {
      clearInterval(resendTimer);
      resendSeconds = RESEND_WAIT;
      resendBtn.disabled = true;
      (function tick() {
        if (resendSeconds <= 0) {
          resendCountdown.textContent = '';
          resendBtn.disabled = false;
          return;
        }
        resendCountdown.textContent = 'Resend in ' + resendSeconds + 's';
        resendSeconds--;
        resendTimer = setTimeout(tick, 1000);
      })();
    }

    // ── Debug OTP helper ──────────────────────────────────────────────────────
    function applyDebugOtp(otp) {
      if (!otp) return;
      debugBadge.style.display = 'block';
      debugOtpValue.textContent = otp;
      otpEl.value = otp;
    }

    // ── Phase transitions ─────────────────────────────────────────────────────
    function enterOtpPhase(debugOtp) {
      phase = 'otp';
      cardTitle.textContent = 'Check your email';
      cardSubtitle.textContent =
        'We sent a 6-digit code to ' + emailEl.value.trim() +
        '. Enter it below to set a new password.';
      emailEl.disabled = true;
      submitLabel.textContent = 'Reset password';
      otpSection.classList.add('visible');
      setStep(2);
      applyDebugOtp(debugOtp);
      startResendCountdown();
      setTimeout(() => otpEl.focus(), 50);
    }

    function enterSuccessPhase(redirect) {
      phase = 'done';
      setStep(3);
      formScreen.style.display = 'none';
      successScreen.style.display = 'block';
      setTimeout(() => {
        window.location.assign(redirect || '/login');
      }, 2600);
    }

    // ── OTP digit-only filter ─────────────────────────────────────────────────
    otpEl.addEventListener('input', () => {
      otpEl.value = otpEl.value.replace(/\D/g, '').slice(0, 6);
    });

    // ── Resend ────────────────────────────────────────────────────────────────
    resendBtn.addEventListener('click', async () => {
      clearErrors();
      setStatus('');
      resendBtn.disabled = true;
      resendCountdown.textContent = 'Sending…';

      try {
        const res  = await fetch('/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailEl.value.trim() })
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          setStatus(data.error || 'Unable to resend code.', 'error');
          resendCountdown.textContent = '';
          resendBtn.disabled = false;
        } else {
          setStatus('A new code has been sent. Check your email.');
          applyDebugOtp(data.debugOtp);
          startResendCountdown();
        }
      } catch {
        setStatus('Network error. Please try again.', 'error');
        resendCountdown.textContent = '';
        resendBtn.disabled = false;
      }
    });

    // ── Submit ────────────────────────────────────────────────────────────────
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();
      setStatus('');

      const email = emailEl.value.trim();

      // ── PHASE 1: send OTP ─────────────────────────────────────────────────
      if (phase === 'email') {
        if (!email || !isValidEmail(email)) {
          emailError.textContent = 'Enter a valid email address.';
          emailEl.focus();
          return;
        }

        setLoading(true);
        submitLabel.textContent = 'Sending…';

        try {
          const res  = await fetch('/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            setStatus(data.error || 'Unable to send code.', 'error');
          } else if (!data.canReset) {
            // Account not found — neutral message to prevent enumeration
            setStatus(data.message || 'If an account exists for that email, a code has been sent.');
          } else {
            enterOtpPhase(data.debugOtp);
          }
        } catch {
          setStatus('Network error. Please try again.', 'error');
        } finally {
          setLoading(false);
          if (phase === 'email') submitLabel.textContent = 'Send code';
        }
        return;
      }

      // ── PHASE 2: verify OTP + reset password ──────────────────────────────
      if (phase === 'otp') {
        const otp      = otpEl.value.trim();
        const password = passwordEl.value;
        const confirm  = confirmEl.value;
        let valid = true;

        if (!otp || otp.length !== 6) {
          otpError.textContent = 'Enter the 6-digit code from your email.';
          valid = false;
        }
        if (!password) {
          passwordError.textContent = 'Enter a new password.';
          valid = false;
        } else if (password.length < 8) {
          passwordError.textContent = 'Password must be at least 8 characters.';
          valid = false;
        }
        if (confirm !== password) {
          confirmError.textContent = 'Passwords do not match.';
          valid = false;
        }
        if (!valid) return;

        setLoading(true);
        submitLabel.textContent = 'Resetting…';

        try {
          const res  = await fetch('/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, otp, password })
          });
          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            const msg = data.error || 'Unable to reset password.';
            const isOtpError = /otp|code|invalid|expired/i.test(msg);
            if (isOtpError) {
              otpError.textContent = msg;
            } else {
              setStatus(msg, 'error');
            }
            submitLabel.textContent = 'Reset password';
          } else {
            enterSuccessPhase(data.redirect);
          }
        } catch {
          setStatus('Network error. Please try again.', 'error');
          submitLabel.textContent = 'Reset password';
        } finally {
          setLoading(false);
        }
      }
    });
  </script>
</body>
</html>
